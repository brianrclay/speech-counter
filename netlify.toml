[build]
  command = "npm run build"
  publish = "www"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# The site's default Netlify subdomain is retired: speechcount.com is the only
# public URL. Anything still reaching the old host is sent to the same path on
# the real domain, because the app treats every *.netlify.app host as staging
# (see billing.js and account.js) and so ran checkout against the RevenueCat
# sandbox key there. Preview and branch deploys keep their own
# <name>--speech-counter.netlify.app hosts and are untouched by this exact-host
# rule.
[[redirects]]
  from = "https://speech-counter.netlify.app/*"
  to = "https://speechcount.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Branch deploys and PR deploy previews are gated behind Basic auth; see
# netlify/edge-functions/staging-auth.js. Production is unaffected. The API
# is excluded so native test builds can talk to a branch deploy.
[[edge_functions]]
  path = "/*"
  excludedPath = "/api/*"
  function = "staging-auth"
