<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Speech Counter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="description" content="Count speech as it happens">
    <meta name="color-scheme" content="light dark">
    <meta property="og:image" content="./assets/app-icon.png" />
    <meta property="og:title" content="Speech Counter" />
    <meta property="og:description" content="Count speech as it happens" />
    <link rel="icon" href="./assets/app-icon.png">
    <link href="./css/reset.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="./css/style.css" rel="stylesheet">
</head>

<body>
    <header class="app-header">
        <h1 class="app-title">Speech Counter</h1>
        <div class="app-actions">
            <button type="button" id="undo" class="btn btn-ghost" disabled aria-label="Undo last action">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10" />
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                </svg>
                <span>Undo</span>
            </button>
            <button type="button" id="clear" class="btn btn-ghost" aria-label="Clear all rows">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                </svg>
                <span>Clear</span>
            </button>
        </div>
    </header>

    <div class="columns" aria-hidden="true">
        <span></span>
        <span class="column-label">Correct</span>
        <span class="column-label">Incorrect</span>
    </div>

    <div class="row-wrapper" id="row-wrapper">
        <div class="row">
            <div class="row-info">
                <input type="text" placeholder="Name">
                <span class="stats">
                    <span class="total bold">Total: <span class="totalCount">0</span></span>
                    <span class="percent bold">Correct: <span class="percentValue">0</span></span>
                </span>
                <button type="button" class="delete-row" aria-label="Remove row">
                    <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                        <path d="M10 11v6" />
                        <path d="M14 11v6" />
                        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                    </svg>
                    <span>Remove</span>
                </button>
            </div>
            <button type="button" class="ticker correct">0</button>
            <button type="button" class="ticker incorrect">0</button>
        </div>
    </div>

    <div class="row template">
        <div class="row-info">
            <input type="text" placeholder="Name">
            <span class="stats">
                <span class="total bold">Total: <span class="totalCount">0</span></span>
                <span class="percent bold">Correct: <span class="percentValue">0</span></span>
            </span>
            <button type="button" class="delete-row" aria-label="Remove row">
                <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                </svg>
                <span>Remove</span>
            </button>
        </div>
        <button type="button" class="ticker correct">0</button>
        <button type="button" class="ticker incorrect">0</button>
    </div>

    <button type="button" id="add-row">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <line x1="12" y1="8" x2="12" y2="16" />
            <line x1="8" y1="12" x2="16" y2="12" />
        </svg>
        <span>Add</span>
    </button>

    <script src="./main.js"></script>
</body>

</html>
