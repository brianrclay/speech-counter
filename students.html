<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Google tag (gtag.js) - skipped on Netlify branch/preview deploys and
         the local dev server so staging traffic stays out of production stats. -->
    <script>
        if (!location.hostname.endsWith('.netlify.app') && location.protocol !== 'http:') {
            window.dataLayer = window.dataLayer || [];
            window.gtag = function () { dataLayer.push(arguments); };
            gtag('js', new Date());
            gtag('config', 'G-QPE28RCTSV');
            var gaScript = document.createElement('script');
            gaScript.async = true;
            gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-QPE28RCTSV';
            document.head.appendChild(gaScript);
        }
    </script>
    <title>Students - Speech Count</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <meta name="description" content="Saved results for each student">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="./assets/app-icon.png">
    <link href="./css/reset.css" rel="stylesheet">
    <link href="./css/style.css" rel="stylesheet">
</head>

<body class="students-page">
    <header class="app-header">
        <a href="./index.html" class="btn btn-ghost back-btn" aria-label="Back to the board">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6" />
            </svg>
            <span>Board</span>
        </a>
        <h1 class="app-title">Students</h1>
        <div class="app-actions">
            <button type="button" id="export" class="btn btn-ghost" aria-label="Export backup">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                <span>Export</span>
            </button>
            <label for="import-file" class="btn btn-ghost" aria-label="Import backup">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                </svg>
                <span>Import</span>
            </label>
            <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
    </header>

    <section id="list-view">
        <input type="search" id="student-search" class="student-search" placeholder="Search students" autocomplete="off">
        <div id="student-list" class="student-list"></div>
        <p id="empty-state" class="empty-state" hidden>
            No students yet. Add a name on the board and tap Correct or Incorrect - the student and their
            session are saved automatically.
        </p>
        <p id="no-matches" class="empty-state" hidden>No students match that search.</p>
    </section>

    <section id="detail-view" hidden>
        <a href="#" class="back-link">&larr; All students</a>
        <div class="student-heading">
            <h2 id="student-name" class="student-name"></h2>
            <button type="button" id="rename" class="btn btn-ghost">Rename</button>
        </div>
        <div class="summary">
            <div class="stat">
                <span class="stat-value" id="stat-sessions">0</span>
                <span class="stat-label">Sessions</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-trials">0</span>
                <span class="stat-label">Trials</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-percent">0%</span>
                <span class="stat-label">Correct</span>
            </div>
        </div>
        <div id="session-list" class="session-list"></div>
        <p id="no-sessions" class="empty-state" hidden>No sessions recorded for this student yet.</p>
        <button type="button" id="delete-student" class="delete-student">Delete student</button>
    </section>

    <div class="row template">
        <div class="row-info">
            <span class="session-time"></span>
            <span class="session-target"></span>
            <button type="button" class="delete-row" aria-label="Remove session">
                <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                </svg>
                <span>Remove</span>
            </button>
        </div>
        <span class="session-count session-correct"></span>
        <span class="session-count session-incorrect"></span>
    </div>

    <footer class="app-footer">
        <a href="./support.html">Support</a>
        <a href="./privacy.html">Privacy Policy</a>
    </footer>

    <script src="./store.js"></script>
    <script src="./students.js"></script>
</body>

</html>
